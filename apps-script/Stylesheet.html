<style>
  :root {
    --bg: #f6f7fb; --card: #fff; --text: #1f2430; --muted: #6b7280;
    --border: #e5e7eb; --primary: #2563eb; --primary-dark: #1d4ed8;
    --accent: #10b981; --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
  }
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; font-size: 1.1rem; cursor: pointer; }
  .content { flex: 1; width: 100%; max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .footer { text-align: center; padding: 20px; color: var(--muted); font-size: .85rem; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; margin-bottom: 20px;
  }
  .card.narrow { max-width: 420px; margin: 40px auto; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.8rem; margin: 0 0 8px; }

  .form { display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .9rem; }
  input {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); font-size: 1rem;
  }
  input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }

  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: .95rem; font-weight: 600;
  }
  .btn:hover:not(:disabled) { border-color: var(--primary); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 6px 12px; font-size: .85rem; }
  .btn.tiny { padding: 2px 8px; font-size: .85rem; }
  .linklike { background: none; border: none; color: var(--primary); cursor: pointer; padding: 0; font-size: .85rem; text-decoration: underline; }
  .linklike.danger { color: var(--danger); }

  .row-form { display: flex; gap: 8px; margin-bottom: 12px; }
  .row-form input { flex: 1; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
  .tab { background: none; border: none; padding: 10px 14px; cursor: pointer; color: var(--muted); font-size: .95rem; font-weight: 600; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .error { color: var(--danger); font-size: .9rem; }
  .save-status { font-size: .8rem; color: var(--accent); font-weight: 600; }

  .trip-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .invite { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .code-chip { background: var(--bg); border: 1px dashed var(--border); padding: 4px 10px; border-radius: 8px; font-size: 1.05rem; letter-spacing: 2px; font-weight: 700; }

  .cal-toolbar { display: flex; align-items: center; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-weekday { text-align: center; font-size: .8rem; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
  .cal-cell {
    position: relative; aspect-ratio: 1/1; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .95rem; color: var(--text);
  }
  .cal-cell.empty { border: none; background: none; cursor: default; }
  .cal-cell.past { opacity: .35; cursor: not-allowed; }
  .cal-cell.selected { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
  .cal-cell:hover:not(.past):not(.empty) { border-color: var(--primary); }
  .cal-count { position: absolute; top: 3px; right: 4px; font-size: .7rem; background: var(--accent); color: #fff; border-radius: 999px; min-width: 16px; height: 16px; line-height: 16px; text-align: center; padding: 0 3px; font-weight: 700; }

  .dest-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .dest-list, .rank-list { list-style: none; padding: 0; margin: 0; }
  .dest-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .dest-list li .name { flex: 1; font-weight: 600; }
  .rank-list li { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
  .rank-num { width: 26px; height: 26px; border-radius: 999px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; flex-shrink: 0; }
  .rank-name { flex: 1; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px dashed var(--border); background: var(--bg); color: var(--text); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .85rem; }
  .chip:hover { border-color: var(--primary); color: var(--primary); }

  .rank-bars { list-style: none; padding: 0; margin: 0; }
  .rank-bars li { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { width: 92px; font-size: .85rem; flex-shrink: 0; }
  .bar-track { flex: 1; height: 14px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { display: block; height: 100%; background: var(--accent); }
  .bar-value { width: 76px; text-align: right; font-size: .8rem; color: var(--muted); flex-shrink: 0; }

  .rank-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .rank-table th, .rank-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  .rank-table th { color: var(--muted); font-size: .8rem; }

  .weather-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .weather-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .weather-temp { font-size: 1.3rem; font-weight: 700; margin: 6px 0 2px; }
  .ai-output { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 12px; line-height: 1.7; }

  @media (max-width: 640px) {
    .dest-layout { grid-template-columns: 1fr; }
    .trip-header { flex-direction: column; }
  }
</style>
